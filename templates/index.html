<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Overview Agent UI</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; max-width: 1100px; }
    h1 { margin-bottom: 0.5rem; }
    form { margin: 1rem 0; display: flex; gap: 0.5rem; }
    input[type="text"] { flex: 1; padding: 0.6rem; font-size: 1rem; }
    button { padding: 0.6rem 1rem; cursor: pointer; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
    pre { white-space: pre-wrap; word-break: break-word; background: #fafafa; padding: 1rem; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Company Overview Provider</h1>
  <p>Enter a company name to get overview, products/services, and shareholder pattern.</p>

  <form method="POST">
    <input
      type="text"
      name="company_name"
      placeholder="e.g., Apple, Microsoft, Reliance Industries"
      value="{{ company_name }}"
      required
    />
    <button type="submit">Get Report</button>
  </form>

  {% if report %}
    <div class="card">
      <h2>Result</h2>
      <pre>{{ report | tojson(indent=2) }}</pre>
    </div>
  {% endif %}
</body>
</html>
